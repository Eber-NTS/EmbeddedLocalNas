<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 NAS SPA</title>
    <style>
        /* --- Global & Layout Styles --- */
        /* Sets a dark theme, uses flexbox to make the body take up exactly 100% of the viewport height (SPA style) */
        body { background-color: #202020; color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        
        /* Top navigation bar containing the title, search, and action buttons */
        .header-bar { border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }

        /* The main wrapper for the sidebar and file list. Flexes to fill the remaining vertical space */
        .main-content { display: flex; flex: 1; gap: 20px; overflow: hidden; flex-direction: column; }

        /* --- Responsive Design --- */
        /* On screens wider than 768px (Tablets/Desktops), switch to a side-by-side layout instead of stacked */
        @media (min-width: 768px) {
            .main-content { flex-direction: row; }
            .sidebar { width: 250px; flex-shrink: 0; }
        }

        /* --- Sidebar & Folder Tree Styles --- */
        .sidebar { background-color: #2d2d2d; border-radius: 8px; padding: 15px; overflow-y: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; flex-direction: column; }
        .folder-tree { list-style-type: none; padding-left: 0; margin: 0; }
        .folder-tree li { margin: 5px 0; }
        .tree-folder { cursor: pointer; padding: 5px; border-radius: 4px; display: flex; align-items: center; }
        .tree-folder:hover { background-color: #3d3d3d; }
        .tree-folder.active { background-color: #4daafc; color: #fff; font-weight: bold; }
        .tree-icon { margin-right: 8px; font-size: 1.2em; }
        .nested-folders { padding-left: 20px; display: none; }
        .nested-folders.open { display: block; }
        .toggle-btn { cursor: pointer; margin-right: 5px; width: 15px; display: inline-block; text-align: center; }

        /* --- Main Content Area (Uploads & File List) --- */
        .content-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

        .file-box { background-color: #2d2d2d; border-radius: 8px; padding: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 20px; flex: 1; overflow-y: auto; }
        .file-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #333; }
        .action-link { text-decoration: none; margin-right: 15px; cursor: pointer; }
        .back-btn { font-size: 20px; color: #fff; text-decoration: none; cursor: pointer; }
        
        /* Drag & Drop Upload Zone Styling */
        .drop-zone {
            background-color: #2d2d2d;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            border: 2px dashed #444;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box;
        }
        /* Applied dynamically via JS when a file is dragged over the zone */
        .drop-zone.dragover {
            background-color: #3d3d3d;
            border-color: #4daafc;
        }
        
        .file-date { flex: 1; color: #aaa; text-align: center; display: none; }
        .file-size { flex: 1; color: #aaa; text-align: center; display: none; }
        
        /* Responsive columns: Hide Date and Size on small phone screens to prevent UI overlapping */
        /* Only show Size column if screen is wider than 400px, and Date if wider than 600px */
        @media (min-width: 400px) { .file-size { display: block; } }
        @media (min-width: 600px) { .file-date { display: block; } }
    </style>
</head>
<body>

<!-- HEADER SECTION: Contains dynamic folder title, sorting rules, search bar, and admin/logout buttons -->
<div class="header-bar">
    <h2 id="current-dir-header" style="margin: 0;">Loading...</h2>
    <div style="display: flex; gap: 5px; flex-wrap: wrap;">
        <select id="sort-select" onchange="onSortChange()" style="padding: 8px; border-radius: 4px; border: 1px solid #444; background: #1a1a1a; color: white;">
            <option value="name_asc">Name (A-Z)</option>
            <option value="name_desc">Name (Z-A)</option>
            <option value="date_desc">Newest First</option>
            <option value="date_asc">Oldest First</option>
        </select>
        <input type="text" id="search-input" placeholder="Search files..." style="padding: 8px; border-radius: 4px; border: 1px solid #444; background: #1a1a1a; color: white;">
        <button onclick="performSearch()" style="background-color: #4daafc; padding: 8px 12px; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">Search</button>
        <button id="admin-panel-btn" onclick="window.location.href='/admin.html'" style="display: none; background-color: #fce84d; color: black; padding: 8px 12px; border:none; border-radius:4px; font-weight:bold; cursor:pointer; margin-left: 10px;">Admin Panel</button>
        <button onclick="logout()" style="background-color: #ff4d4d; padding: 8px 12px; border:none; border-radius:4px; font-weight:bold; cursor:pointer; margin-left: 10px;">Logout</button>
    </div>
</div>

<!-- MAIN APPLICATION CONTAINER -->
<div class="main-content">
    
    <!-- SIDEBAR: Navigation panel for the interactive folder tree -->
    <div class="sidebar">
        <h3 style="margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 10px;">Folders</h3>
        <ul class="folder-tree" id="folder-tree">
            <!-- Tree will be populated here -->
        </ul>
    </div>

    <!-- CONTENT AREA: Right side (or bottom on mobile) containing uploads and file lists -->
    <div class="content-area">
        
        <!-- UPLOAD ZONE: Handles both standard form file-picking and drag-and-drop -->
        <div class="drop-zone" id="drop-zone">
            <h3>Upload File</h3>
            <p style="color: #aaa; margin-bottom: 15px;">Drag & Drop files here, or choose a file below</p>
            <form id="upload-form">
                <input type="file" id="upload-input" required style="color:white; max-width: 100%;">
                <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
                    <button type="submit" id="upload-btn" style="background-color: #4daafc; padding: 8px 16px; border:none; border-radius:4px; font-weight:bold; cursor: pointer; margin-top: 10px;">Upload</button>
                    <button type="button" onclick="createNewFolder()" style="background-color: #fce84d; color: #000; padding: 8px 16px; border:none; border-radius:4px; font-weight:bold; cursor: pointer; margin-top: 10px;">+ New Folder</button>
                </div>
            </form>
            
            <!-- Upload Progress Bar Container (Hidden by default, shown during XHR upload stream) -->
            <div id="progress-container" style="display: none; margin-top: 15px;">
                <div style="background: #1a1a1a; border-radius: 4px; height: 15px; overflow: hidden; border: 1px solid #444;">
                    <div id="progress-bar" style="background: #4dfc67; width: 0%; height: 100%; transition: width 0.2s ease;"></div>
                </div>
                <div id="progress-text" style="color: #aaa; font-size: 12px; margin-top: 5px; font-weight: bold;">0%</div>
            </div>
            <div id="upload-stats" style="color: #4daafc; font-size: 13px; margin-top: 10px; font-weight: bold; display: none;"></div>
        </div>

        <!-- FILE LIST: Dynamically populated by JS fetch calls to the ESP32 /api/list endpoint -->
        <div class="file-box" id="file-list">
            <!-- Files will be populated here -->
        </div>
    </div>
</div>

<script>
    // Global variables:
    let currentDirectory = "/"; //Remembers the current folder being viewed
    let lastDataJson = ""; //stores a text copy of the last data the esp32 sent. Used to check if anything has actually changed before redrawing the screen. Prevents the screen from flickering every 3 seconds.
    let isSearching = false; //Keeps track if the user is currently looking at search results rather than a standard folder
    let currentSearchQuery = ""; //keeps track of what query was requested
    let currentSort = "name_asc"; // Default sort order
    let currentUserRole = 0; // Default to View Only to fail-safe UI until verified
    let sessionUploadSpeeds = []; // Tracks all upload speeds in this session

    // Cache for folder structure to build the tree
    // This prevents the application from having to re-fetch the entire folder structure from the ESP32 every time the user clicks a folder
    let folderCache = {
        "/": { fetched: false, subfolders: [] }
    };

    // Fetches the current user's role from the ESP32 to adjust UI permissions
    async function checkUserRole() {
        try {
            const response = await fetch('/api/me');
            if (response.ok) {
                const data = await response.json();
                currentUserRole = data.role;
                // If the user is an Admin (Role 2) or Master Admin (Role 3), show the Admin Panel button
                if (currentUserRole >= 2) {
                    document.getElementById('admin-panel-btn').style.display = 'inline-block';
                }
                // If the user is View-Only (Role 0), completely hide the drag-and-drop upload box
                if (currentUserRole === 0) {
                    document.getElementById('drop-zone').style.display = 'none'; // Hide uploads for View Only
                }
            } else if (response.status === 401) {
                // If the ESP32 says the session is invalid or missing, force the user back to the login screen
                window.location.href = "/login.html";
            }
        } catch (err) {
            console.error("Failed to fetch user info", err);
        }
    }

    // Call checkUserRole on page load
    checkUserRole();

    // Triggered when the user changes the "Sort By" dropdown menu
    function onSortChange() {
        currentSort = document.getElementById('sort-select').value;
        lastDataJson = ""; // Clear the HTML diff cache to force a complete re-render of the file list
        if (isSearching) {
            performSearch(currentSearchQuery);
        } else {
            loadDirectory(currentDirectory, false);
        }
    }
    
    // Sync the browser's time to the ESP32 (since the offline NAS has no internet access to reach an NTP server)
    // This makes sure that created files and activity logs have accurate timestamps.
    async function syncTime() {
        if (!sessionStorage.getItem('timeSynced')) {
            const timestamp = Math.floor(Date.now() / 1000);
            try {
                const response = await fetch('/api/time', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'time=' + timestamp
                });
                if (response.ok) {
                    sessionStorage.setItem('timeSynced', 'true'); // Store in sessionStorage so it only syncs once per tab, preventing spam
                }
            } catch (e) { console.error("Time sync failed", e); }
        }
    }
    syncTime();

    // Helper function to safely concatenate folder paths.
    // Prevents generating invalid paths with double slashes like "//subfolder" when branching from the root ("/")
    function buildPath(parent, name) {
        if (parent === "/") return "/" + name;
        return parent + "/" + name;
    }

    // Initial root fetch for the tree. Kicks off the first API call to populate the sidebar.
    async function initTree() {
        await fetchFolderData("/");
        renderTree();
    }

    // Fetch data specifically for a folder to populate the tree
    async function fetchFolderData(path) {
        try {
            // We use sort=name_asc specifically for the tree to keep it organized
            const response = await fetch(`/api/list?dir=${path}&sort=name_asc&index=false`);
            if (!response.ok) return;
            const data = await response.json();

            // Extract only folders
            const folders = data.files.filter(f => f.isFolder);

            if (!folderCache[path]) {
                folderCache[path] = { fetched: true, subfolders: [], open: false };
            }
            folderCache[path].fetched = true;
            folderCache[path].subfolders = folders.map(f => f.name);

            // Register empty entries for the new subfolders if they don't exist
            folders.forEach(f => {
                const subPath = buildPath(path, f.name);
                if (!folderCache[subPath]) {
                    folderCache[subPath] = { fetched: false, subfolders: [], open: false };
                }
            });

        } catch (e) {
            console.error("Error fetching folder data for tree", e);
        }
    }

    async function toggleFolder(path, event) {
        if (event) {
            event.stopPropagation(); // Prevent row click from firing
        }

        if (folderCache[path]) {
            folderCache[path].open = !folderCache[path].open;

            // If opening and haven't fetched yet, fetch now
            if (folderCache[path].open && !folderCache[path].fetched) {
                await fetchFolderData(path);
            }
            renderTree();
        }
    }

    // Recursively generates the HTML for a folder and its subdirectories in the sidebar tree.
    function renderTreeLevel(path) {
        const node = folderCache[path];
        if (!node) return "";

        let html = "";

        // Don't render a row for root itself, just its children
        if (path !== "/") {
            // Extract just the current folder's name from the full path
            const pathParts = path.split('/');
            const name = pathParts[pathParts.length - 1];
            const isActive = currentDirectory === path;
            const activeClass = isActive ? "active" : "";

            // A folder might have children if the cache has items, OR if we haven't fetched it yet
            const hasChildren = node.subfolders.length > 0 || !node.fetched;
            const isOpen = node.open;

            let toggleIcon = "";
            if (hasChildren) {
                // Add an expand/collapse arrow if the folder has (or might have) children
                toggleIcon = `<span class="toggle-btn" onclick="toggleFolder('${path}', event)">${isOpen ? '▼' : '▶'}</span>`;
            } else {
                toggleIcon = `<span class="toggle-btn" style="cursor:default;"></span>`; // Invisible placeholder to keep text alignment aligned
            }

            html += `
                <li>
                    <div class="tree-folder ${activeClass}" onclick="loadDirectory('${path}')" ondblclick="renameItem('${path}', '${name}', true, event)">
                        ${toggleIcon}
                        <span class="tree-icon">📁</span>
                        <span>${name}</span>
                    </div>
            `;
        }

        // Render children if root or if this node is open
        if (path === "/" || node.open) {
            const ulClass = path === "/" ? "" : "nested-folders open";
            const ulStyle = path === "/" ? "" : "";

            if (node.subfolders.length > 0) {
                html += `<ul class="${ulClass}">`;
                // Recursively call renderTreeLevel for every subfolder
                node.subfolders.forEach(sub => {
                    html += renderTreeLevel(buildPath(path, sub));
                });
                html += `</ul>`;
            } else if (path !== "/" && node.fetched) {
                 // If the folder was fetched, is open, but has no subfolders, show a placeholder
                 html += `<ul class="${ulClass}"><li><span style="color:#666; font-size: 0.9em; margin-left: 25px;">(empty)</span></li></ul>`;
            }
        }

        if (path !== "/") {
            html += `</li>`;
        }

        return html;
    }

    // Entry point for drawing the sidebar folder tree.
    // Completely replaces the contents of the #folder-tree element.
    function renderTree() {
        const treeDiv = document.getElementById('folder-tree');

        const isRootActive = currentDirectory === "/";
        const rootActiveClass = isRootActive ? "active" : "";

        // Create a dedicated hard-coded row for the Root directory
        let rootHtml = `
            <li>
                <div class="tree-folder ${rootActiveClass}" onclick="loadDirectory('/')">
                    <span class="toggle-btn" onclick="toggleFolder('/', event)">${folderCache["/"].open ? '▼' : '▶'}</span>
                    <span class="tree-icon">📁</span>
                    <span>Root</span>
                </div>
            </li>
        `;

        // Render root's children directly into the main ul if open
        if (folderCache["/"].open) {
            let childrenHtml = "";
            folderCache["/"].subfolders.forEach(sub => {
                childrenHtml += renderTreeLevel("/" + sub);
            });
            if (childrenHtml) {
                 rootHtml += `<ul class="nested-folders open">${childrenHtml}</ul>`;
            }
        }

        // Apply the generated HTML to the DOM
        treeDiv.innerHTML = rootHtml;
    }

    // Automatically open parents of the current directory
    async function ensurePathOpenInTree(path) {
        if (path === "/") {
            folderCache["/"].open = true;
            return;
        }

        const parts = path.split('/').filter(p => p);
        let currentPath = "";

        folderCache["/"].open = true;

        for (let i = 0; i < parts.length; i++) {
            currentPath += "/" + parts[i];

            if (!folderCache[currentPath]) {
                folderCache[currentPath] = { fetched: false, subfolders: [], open: false };
            }

            folderCache[currentPath].open = true;

            if (!folderCache[currentPath].fetched) {
                await fetchFolderData(currentPath);
            }
        }
    }


    //Asks the esp32 for the contents of a specific folder.
    async function loadDirectory(path, pushHistory = true, isBackgroundPoll = false) {

        isSearching = false;  //Search mode is used for refreshing to a search directory. Folder mode is used for refreshing currant folder.
        if (currentDirectory !== path) { //checks if the user wants to look at a different path than from the current one.
            lastDataJson = "";// if the user is going to a new folder
        }
        currentDirectory = path; //updates the current path being tracked. Remembers the folder that was just clicked.

        //Updates the browser's URL using window.History.pushState
        if (pushHistory) {
            window.history.pushState({ path: path }, "", "?dir=" + path);//built-in browser feature that tells the browser to change the URL address bar and save it to the user's history. Does not actually reload the page.
        }
        //searches the html document for the target id="current-dir-header". located in <h2>
        //changes the visible text inside the header to match the new folder just opened.
        document.getElementById('current-dir-header').innerText = "Index of: " + path;

        // Ensure tree reflects current path
        if (!isBackgroundPoll) {
             await ensurePathOpenInTree(path);
             renderTree();
        }

        //
        try {
            const indexParam = isBackgroundPoll ? "false" : "true";
            const response = await fetch(`/api/list?dir=${path}&sort=${currentSort}&index=${indexParam}&_t=${Date.now()}`);
            if (response.status === 401) {
                window.location.href = "/login.html";
                return;
            }

            // Use raw text comparison to perfectly detect changes without JSON key-order bugs
            const rawText = await response.text();
            if (rawText !== lastDataJson) {
                lastDataJson = rawText;
                const data = JSON.parse(rawText);
                renderFiles(data.files, data.dir);

                // Update tree cache for current directory with the new folder list
                const folders = data.files.filter(f => f.isFolder);
                if (folderCache[path]) {
                    folderCache[path].fetched = true;
                    folderCache[path].subfolders = folders.map(f => f.name);

                    folders.forEach(f => {
                        const subPath = buildPath(path, f.name);
                        if (!folderCache[subPath]) {
                            folderCache[subPath] = { fetched: false, subfolders: [], open: false };
                        }
                    });
                    renderTree(); // Ensure the sidebar updates for other users' changes
                }
            }
        } catch (err) {
            console.error("Failed to load directory", err);
        }
    }


    function renderFiles(files, dirPath) {
        const fileListDiv = document.getElementById('file-list');
        let html = "";


        if (dirPath !== "/") {
            let parentPath = dirPath.substring(0, dirPath.lastIndexOf('/'));
            if (parentPath === "") parentPath = "/";
            
            html += `
                <div class="file-row">
                    <span class="back-btn" onclick="loadDirectory('${parentPath}')">⬅️ .. (Up one level)</span>
                </div>
            `;
        }

        if (files.length === 0) {
            fileListDiv.innerHTML = html + "<p style='color: #888; text-align: center; padding: 10px;'>Folder is empty.</p>";
            return;
        }


        files.forEach(file => {
            const icon = file.isFolder ? "📁" : "📄";
            const sizeText = file.isFolder ? "--" : Math.floor(file.size / 1024) + " KB";
            const dateText = file.lastMod ? new Date(file.lastMod * 1000).toLocaleDateString() : "--";
            
            let itemPath = dirPath.endsWith("/") ? dirPath + file.name : dirPath + "/" + file.name;

            let primaryAction = file.isFolder 
                ? `<span class="action-link" style="color: #fce84d;" onclick="loadDirectory('${itemPath}')">Open</span>`
                : `<a class="action-link" style="color: #4daafc;" href="/download?file=${itemPath}">Download</a>`;
                
            let deleteAction = (currentUserRole >= 1) ? `<span class="action-link" style="color: #ff4d4d;" onclick="deleteFile('${itemPath}', '${file.name}')">Delete</span>` : "";

            html += `
                <div class="file-row" title="Double-click to rename" ondblclick="renameItem('${itemPath}', '${file.name}', ${file.isFolder}, event)">
                    <div style="flex: 2; display: flex; align-items: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                        <span style="font-size: 24px; margin-right: 15px;">${icon}</span><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${file.name}</span>
                    </div>
                    <div class="file-date">${dateText}</div>
                    <div class="file-size">${sizeText}</div>
                    <div style="flex: 1; text-align: right; min-width: max-content;">${primaryAction}${deleteAction}</div>
                </div>
            `;
        });
        fileListDiv.innerHTML = html;
    }

    
    async function deleteFile(path, name) {
        if (!confirm(`Are you sure you want to delete ${name}?`)) return;
        
        await fetch(`/delete?file=${path}`, { method: 'GET' });
        lastDataJson = ""; // Force re-render

        // Remove from tree cache if it's a folder
        const parentPath = currentDirectory;
        if (folderCache[parentPath]) {
            folderCache[parentPath].subfolders = folderCache[parentPath].subfolders.filter(f => f !== name);
            renderTree();
        }

        loadDirectory(currentDirectory, false); // Instantly refresh folder list
    }
    
    // Specialized delete function for the search view
    async function deleteSearchItem(path, name) {
        if (!confirm(`Are you sure you want to delete ${name}?`)) return;
        
        await fetch(`/delete?file=${path}`, { method: 'GET' });
        lastDataJson = ""; // Force re-render

        // We'd need the parent dir to update the tree cache here accurately,
        // but for search view a full refresh is safer anyway
        folderCache = { "/": { fetched: false, subfolders: [] } };
        await initTree();

        performSearch(currentSearchQuery); // Instantly refresh search results
    }

    async function performSearch(query) {
        const q = query || document.getElementById('search-input').value;
        if (!q) {
            loadDirectory(currentDirectory);
            return;
        }

        isSearching = true;
        currentSearchQuery = q;
        document.getElementById('current-dir-header').innerText = "Search results for: " + q;

        // Highlight nothing in tree during search
        const currentActive = document.querySelector('.tree-folder.active');
        if (currentActive) currentActive.classList.remove('active');

        try {
            const response = await fetch(`/api/search?q=${encodeURIComponent(q)}&sort=${currentSort}&_t=${Date.now()}`);
            if (response.status === 401) {
                window.location.href = "/login.html";
                return;
            }

            const rawText = await response.text();
            if (rawText !== lastDataJson) {
                lastDataJson = rawText;
                const data = JSON.parse(rawText);
                renderSearchResults(data.files);
            }
        } catch (err) {
            console.error("Search failed", err);
        }
    }

    // Renders the list of files returned by a search query.
    // This is different from standard folder rendering because search results can come from multiple
    // different directories, so we must display the file's parent path underneath its name.
    function renderSearchResults(files) {
        const fileListDiv = document.getElementById('file-list');
        let html = `
            <div class="file-row">
                <!-- Button to exit search mode and return to the folder the user was just looking at -->
                <span class="back-btn" onclick="loadDirectory(currentDirectory)">⬅️ Back to folder</span>
            </div>
        `;

        if (files.length === 0) {
            fileListDiv.innerHTML = html + "<p style='color: #888; text-align: center; padding: 10px;'>No files found.</p>";
            return;
        }

        files.forEach(file => {
            const icon = file.isFolder ? "📁" : "📄";
            const sizeText = file.isFolder ? "--" : Math.floor(file.size / 1024) + " KB";
            const dateText = file.lastMod ? new Date(file.lastMod * 1000).toLocaleDateString() : "--";
            let itemPath = file.parentDir.endsWith("/") ? file.parentDir + file.name : file.parentDir + "/" + file.name;

            // Determine if clicking "Open" should navigate into a folder, or download a file
            let primaryAction = file.isFolder 
                ? `<span class="action-link" style="color: #fce84d;" onclick="loadDirectory('${itemPath}')">Open</span>`
                : `<a class="action-link" style="color: #4daafc;" href="/download?file=${itemPath}">Download</a>`;
                
            // Only show the delete button if the user has Standard (Role 1) or higher permissions
            let deleteAction = (currentUserRole >= 1) ? `<span class="action-link" style="color: #ff4d4d;" onclick="deleteSearchItem('${itemPath}', '${file.name}')">Delete</span>` : "";

            html += `
                <div class="file-row" title="Double-click to rename" ondblclick="renameItem('${itemPath}', '${file.name}', ${file.isFolder}, event)">
                    <div style="flex: 2; display: flex; align-items: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                        <div style="display: flex; flex-direction: column; overflow: hidden;">
                            <div style="display: flex; align-items: center;">
                                <span style="font-size: 24px; margin-right: 15px;">${icon}</span><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${file.name}</span>
                            </div>
                            <!-- Display the directory path where this search result was found -->
                            <small style="color: #666; margin-left: 39px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${file.parentDir}</small>
                        </div>
                    </div>
                    <div class="file-date">${dateText}</div>
                    <div class="file-size">${sizeText}</div>
                    <div style="flex: 1; text-align: right; min-width: max-content;">${primaryAction}${deleteAction}</div>
                </div>
            `;
        });
        fileListDiv.innerHTML = html;
    }

    // Safely end session on the backend, clear the local cookie, and redirect to the login screen
    async function logout() {
        try {
            // Tell the ESP32 to instantly invalidate the current session token in its memory
            await fetch('/api/logout', { method: 'POST' });
        } catch(e) { console.error(e); }
        
        // Fallback cookie clear, Just in case the server was offline or unreachable,
        // force the browser to forget the cookie by setting its expiration date to the past.
        document.cookie = "ESP32_SESSION=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        window.location.href = "/login.html";
    }

    // Allow hitting "Enter" on the keyboard while focused on the search box to trigger the search
    document.getElementById('search-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') performSearch();
    });

    // Listen for the browser's native "Back" and "Forward" buttons
    window.addEventListener("popstate", (event) => {
        if (event.state && event.state.path) {
            // If we have history state, load that directory without pushing a new history state
            loadDirectory(event.state.path, false);
        } else {
            loadDirectory("/", false);
        }
    });


    // Handles transmitting the selected file to the ESP32
    async function uploadFile(file) {
        const formData = new FormData();
        formData.append('upload_file', file);

        // Reset and show the UI progress bar components
        const submitBtn = document.getElementById('upload-btn');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const statsText = document.getElementById('upload-stats');
        
        submitBtn.disabled = true;
        submitBtn.innerText = "Uploading...";
        progressContainer.style.display = "block";
        progressBar.style.width = "0%";
        progressText.innerText = "0%";
        statsText.style.display = "none";

        const timestamp = Math.floor(Date.now() / 1000);
        const url = `/upload?dir=${currentDirectory}&time=${timestamp}`;

        // We wrap this in a Promise so other functions can 'await' the upload to finish.
        return new Promise((resolve, reject) => {
            // We use the older XMLHttpRequest (XHR) instead of 'fetch' here because
            // fetch does not currently have native support for tracking upload progress events.
            const xhr = new XMLHttpRequest();
            const startTime = performance.now();

            // Event listener that is called continuously as chunks of the file are sent over the network
            xhr.upload.addEventListener("progress", (event) => {
                if (event.lengthComputable) {
                    const percentComplete = Math.round((event.loaded / event.total) * 100);
                    
                    // Calculate speed calculation: (Megabits) / (Seconds)
                    const durationSec = (performance.now() - startTime) / 1000;
                    let speedText = "";
                    if (durationSec > 0) {
                        // (Bytes * 8 bits/byte) / 1,048,576 bits/Megabit
                        const liveMbps = ((event.loaded * 8) / (1024 * 1024)) / durationSec;
                        speedText = ` @ ${liveMbps.toFixed(2)} Mbps`;
                    }
                    
                    // Update the visual progress bar width and text readouts
                    progressBar.style.width = percentComplete + "%";
                    progressText.innerText = percentComplete + "% (" + Math.floor(event.loaded / 1024) + " KB / " + Math.floor(event.total / 1024) + " KB)" + speedText;
                }
            });

            // Event listener that is called when the upload fully finishes (or errors out with an HTTP code)
            xhr.addEventListener("load", async () => {
                submitBtn.disabled = false;
                submitBtn.innerText = "Upload";
                progressContainer.style.display = "none";

                // Handle expired session during an active upload
                if (xhr.status === 401) {
                    window.location.href = "/login.html";
                    reject("Unauthorized");
                    return;
                }

                if (xhr.status === 200) {
                    // Final speed and average calculations
                    const totalDurationSec = (performance.now() - startTime) / 1000;
                    const finalMbps = ((file.size * 8) / (1024 * 1024)) / totalDurationSec;
                    
                    // Add to session speeds array to calculate the rolling average
                    sessionUploadSpeeds.push(finalMbps);
                    const avgMbps = sessionUploadSpeeds.reduce((a, b) => a + b, 0) / sessionUploadSpeeds.length;
                    
                    statsText.innerText = `Last Upload: ${totalDurationSec.toFixed(1)}s (${finalMbps.toFixed(2)} Mbps) | Session Avg: ${avgMbps.toFixed(2)} Mbps`;
                    statsText.style.display = "block";

                    // Clear the file picker input and force a folder refresh so the new file shows up instantly
                    document.getElementById('upload-input').value = "";
                    lastDataJson = ""; // Force re-render
                    await loadDirectory(currentDirectory, false);
                    resolve();
                } else {
                    alert("Upload failed with status: " + xhr.status);
                    reject("Server Error");
                }
            });

            // Listen for network errors
            xhr.addEventListener("error", () => {
                submitBtn.disabled = false;
                submitBtn.innerText = "Upload";
                progressContainer.style.display = "none";
                alert("Upload failed due to a network error");
                reject("Network Error");
            });

            // Open the connection and send the multipart form data payload
            xhr.open("POST", url, true);
            xhr.send(formData);
        });
    }


    document.getElementById('upload-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fileInput = document.getElementById('upload-input');
        if(fileInput.files.length === 0) return;
        await uploadFile(fileInput.files[0]);
    });

    // Drag and drop event listeners
    const dropZone = document.getElementById('drop-zone');

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
    });

    dropZone.addEventListener('drop', async (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;

        if (files.length === 0) return;

        // Update input element for visual feedback
        const fileInput = document.getElementById('upload-input');
        fileInput.files = files;

        await uploadFile(files[0]);
    });

    // Create a new folder
    async function createNewFolder() {
        const folderName = prompt("Enter new folder name:");
        if (!folderName || folderName.trim() === "") return;

        // Basic validation
        if (folderName.includes("/") || folderName.includes("\\") || folderName.includes("..")) {
            alert("Invalid folder name. Please avoid using slashes or dots.");
            return;
        }

        const formData = new FormData();
        formData.append("dir", currentDirectory);
        formData.append("name", folderName.trim());

        try {
            const response = await fetch('/api/create_folder', {
                method: 'POST',
                body: formData
            });

            if (response.status === 401) {
                window.location.href = "/login.html";
                return;
            }

            if (response.ok) {
                lastDataJson = ""; // Force re-render
                
                // Clear the tree cache for this path so the new folder shows up immediately on the left panel
                if (folderCache[currentDirectory]) folderCache[currentDirectory].fetched = false;
                
                await loadDirectory(currentDirectory, false); // Instantly refresh folder list
            } else {
                const errText = await response.text();
                alert("Error creating folder: " + errText);
            }
        } catch (err) {
            console.error(err);
            alert("Network error while creating folder.");
        }
    }

    async function renameItem(oldPath, oldName, isFolder, event) {
        if (event) {
            event.stopPropagation(); // Stops the folder from opening when you double click it
            event.preventDefault(); // Prevents annoying text selection highlighting
        }
        
        if (currentUserRole < 1) return; // View-only users cannot rename

        const newName = prompt("Enter new name for:", oldName);
        if (!newName || newName.trim() === "" || newName === oldName) return;

        if (newName.includes("/") || newName.includes("\\") || newName.includes("..")) {
            alert("Invalid name. Please avoid using slashes or dots.");
            return;
        }

        const formData = new FormData();
        formData.append("oldPath", oldPath);
        formData.append("newName", newName.trim());

        try {
            const response = await fetch('/api/rename', { method: 'POST', body: formData });
            if (!response.ok) {
                const errText = await response.text();
                alert("Error renaming: " + errText);
                return;
            }

            lastDataJson = ""; // Force re-render

            // If we renamed a folder we are currently inside of, we need to "teleport"
            if (isFolder && (currentDirectory === oldPath || currentDirectory.startsWith(oldPath + "/"))) {
                const newPath = oldPath.substring(0, oldPath.lastIndexOf('/') + 1) + newName;

                // Reset the entire tree cache to be safe
                folderCache = { "/": { fetched: false, subfolders: [] } };
                await initTree();

                await loadDirectory(newPath, true);
            } else {
                // Otherwise, just refresh the current view
                const parentDir = oldPath.substring(0, oldPath.lastIndexOf('/')) || "/";
                if (folderCache[parentDir]) folderCache[parentDir].fetched = false;
                await loadDirectory(currentDirectory, false);
            }

        } catch (err) {
            console.error(err);
            alert("Network error while renaming.");
        }
    }

    // Startup sequence
    initTree();
    const urlParams = new URLSearchParams(window.location.search);
    const startDir = urlParams.get('dir') || "/";
    loadDirectory(startDir);

    // Smart background polling for multi-user live updates
    setInterval(() => {
        if (isSearching) {
            performSearch(currentSearchQuery); // Search is already read-only
        } else {
            loadDirectory(currentDirectory, false, true); // true = isBackgroundPoll (skips SD card thrashing)
        }
    }, 5000); 

    // Immediately fetch new data when the user switches back to this browser tab
    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
            if (isSearching) performSearch(currentSearchQuery);
            else loadDirectory(currentDirectory, false, true);
        }
    });
</script>
